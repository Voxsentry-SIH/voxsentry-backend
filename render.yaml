services:
  - type: web
    name: voxsentry-api
    runtime: python
    pythonVersion: 3.11
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MODEL_PATH
        sync: false
      - key: EMBEDDING_MODEL_PATH
        sync: false
      - key: FRONTEND_URL
        sync: false
